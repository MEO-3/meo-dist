# MEO 3 gateway broker: local-first, no bridge, no auth.
# Installed as /etc/mosquitto/conf.d/meo-3.conf.
#
# Anonymous access is deliberate — the broker carries classroom device traffic
# on a local network and the child-facing flow has no credential step. Do not
# expose port 1883 beyond the gateway's LAN.

# Only what MEO needs. Debian's mosquitto.conf already sets persistence and
# persistence_location, and a duplicate persistence_location is fatal — it kept
# the broker from starting at all.
listener 1883
allow_anonymous true
